    <symbol id="i-edges" viewBox="0 0 24 24"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 8l8 4.5L20 8M12 12.5v8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>

    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 4.5v15" stroke="currentColor" stroke-width="1.6"/></symbol>

    <symbol id="i-pick" viewBox="0 0 24 24"><path d="M12 3v5m0 8v5M3 12h5m8 0h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h12m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14.5 5.5 4 4L9 19H5v-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12.5 7.5 4 4" stroke="currentColor" stroke-width="1.6"/></symbol>

    <symbol id="i-layout2" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-layout4" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5v14M3.5 12h17" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-focusmode" viewBox="0 0 24 24"><path d="M4 8.5V4.5h4M20 8.5V4.5h-4M4 15.5v4h4M20 15.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="8.5" width="8" height="7" rx=".8" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-exitfocus" viewBox="0 0 24 24"><path d="M8.5 4v4.5H4M15.5 4v4.5H20M8.5 20v-4.5H4M15.5 20v-4.5H20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><path d="M4.5 5.5h15v10h-8l-4.5 3.5v-3.5H4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10.2 8.9a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="13.6" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-axes" viewBox="0 0 24 24"><path d="M6 18V4.5M6 18h13.5M6 18l-3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m3.8 6.8 2.2-2.3 2.2 2.3M17.2 15.8l2.3 2.2-2.3 2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 14h6M10 10h6M14 8v8M10 8v8" stroke="currentColor" stroke-width="1" opacity=".55"/></symbol>

    <symbol id="i-cube-iso" viewBox="0 0 24 24"><path d="M12 3.5 19.5 7.7v8.6L12 20.5l-7.5-4.2V7.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.5 7.7 12 12l7.5-4.3M12 12v8.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>

</svg>

<header class="toolbar" role="banner">
  <div class="brand"><svg class="icon mark" aria-hidden="true"><use href="#i-mark"/></svg><span>Skid workspace</span></div>
  <div class="tb-group project" id="tb-project">
    <span class="tb-label">Project</span>
    <button type="button" class="tb-name" id="tb-project-name" aria-label="Rename project"><span class="tb-value" id="tb-project-id">—</span><svg class="icon pen" aria-hidden="true"><use href="#i-edit"/></svg></button>
    <form class="tb-name-form" id="tb-name-form" hidden>
      <input type="text" id="tb-name-input" aria-label="Project name" aria-describedby="tb-name-msg" autocomplete="off" spellcheck="false">
      <button type="submit" class="tb-mini ok" id="tb-name-save" title="Save the name (Enter)" aria-label="Save project name"><svg class="icon"><use href="#i-check"/></svg></button>
      <button type="button" class="tb-mini" id="tb-name-cancel" title="Cancel (Esc)" aria-label="Cancel renaming"><svg class="icon"><use href="#i-close"/></svg></button>
      <div class="tb-name-msg" id="tb-name-msg" role="status" aria-live="polite" hidden></div>
    </form>
    <span class="tb-label">Revision</span><span class="tb-value rev" id="tb-revision">—</span>
    <span class="tb-doc" id="tb-doc"></span>
  </div>
  <div class="tb-group status">
    <span id="tb-sync" class="badge tone-none"><i class="dot"></i>Connecting</span>
    <span id="tb-build" class="tb-build"></span>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-group actions" role="toolbar" aria-label="Project actions">
    <button class="tb-btn" id="btn-undo" title="Undo (Ctrl/⌘ Z)"><svg class="icon"><use href="#i-undo"/></svg><span>Undo</span><em id="undo-count"></em></button>
    <button class="tb-btn" id="btn-redo" title="Redo (Ctrl/⌘ Shift Z)"><svg class="icon"><use href="#i-redo"/></svg><span>Redo</span><em id="redo-count"></em></button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="btn-save" title="Confirm the saved file on disk for the current revision"><svg class="icon"><use href="#i-save"/></svg><span>Save</span></button>
    <button class="tb-btn" id="btn-reopen" title="Reload the project file and its history from disk"><svg class="icon"><use href="#i-reopen"/></svg><span>Reopen</span></button>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="btn-build" title="Generate all five outputs for the current revision"><svg class="icon"><use href="#i-build"/></svg><span>Rebuild</span></button>
    <button class="tb-btn danger" id="btn-cancel" title="Cancel the running or queued build" hidden><svg class="icon"><use href="#i-cancel"/></svg><span>Cancel</span></button>
    <span class="tb-sep"></span>
    <div class="menu-wrap">
      <button class="tb-btn" id="btn-downloads" aria-haspopup="true" aria-expanded="false" title="Download verified outputs"><svg class="icon"><use href="#i-download"/></svg><span>Outputs</span></button>
      <div class="menu" id="menu-downloads" role="menu" hidden></div>
    </div>
    <span class="conn" id="tb-conn" title="Connection to the local service"><i></i></span>
    <button class="tb-btn icon-only" id="btn-inspector" title="Show or hide the inspector"><svg class="icon"><use href="#i-panel"/></svg></button>
    <button class="tb-btn icon-only" id="btn-dock" title="Show or hide activity and feedback"><svg class="icon"><use href="#i-dock"/></svg></button>
    <span class="tb-sep"></span>
    <div class="seg tb-seg" id="layout-seg" role="radiogroup" aria-label="View panes">
      <button type="button" data-layout="2" role="radio" aria-checked="true" title="Two panes side by side" aria-label="Two panes"><svg class="icon"><use href="#i-layout2"/></svg></button>
      <button type="button" data-layout="4" role="radio" aria-checked="false" title="Four panes, 2 × 2" aria-label="Four panes"><svg class="icon"><use href="#i-layout4"/></svg></button>
    </div>
    <button class="tb-btn icon-only" id="btn-focus" aria-pressed="false" title="Focus: show only the view panes (Esc returns)" aria-label="Focus on the view panes"><svg class="icon"><use href="#i-focusmode"/></svg></button>
  </div>
</header>

<main class="workspace" id="workspace">
  <section class="views" id="views" data-panes="2" aria-label="View panes"></section>

  <aside class="inspector" id="inspector" aria-label="Inspector">
    <div class="insp-scroll" id="insp-body"></div>
  </aside>

  <section class="dock" id="dock" aria-label="Activity and changes">
    <div class="dock-pane" id="dock-activity">
      <header class="pane-head"><span class="pane-title">Activity</span><span class="pane-meta" id="act-meta"></span></header>
      <div class="act-artifacts" id="act-artifacts"></div>
      <ol class="act-log" id="act-log" aria-live="polite"></ol>
    </div>
    <div class="dock-pane" id="dock-change">
      <header class="pane-head">
        <div class="tabs small" role="tablist" id="change-tabs">
          <button role="tab" data-tab="feedback" class="on" aria-selected="true">Feedback</button>
          <button role="tab" data-tab="command" aria-selected="false">Command JSON</button>
        </div>
        <span class="pane-meta" id="change-meta"></span>
      </header>
      <div class="change-panel change-entry" id="panel-feedback-entry"></div>
      <div class="change-panel" id="panel-feedback"></div>
      <div class="change-panel" id="panel-command" hidden></div>
    </div>
  </section>

</main>

<div class="focus-bar" id="focus-bar" hidden>
  <button type="button" class="focus-exit" id="btn-exit-focus" title="Exit focus (Esc)" aria-label="Exit focus and restore the panels"><svg class="icon"><use href="#i-exitfocus"/></svg><span>Exit focus</span></button>
</div>
<div class="conn-banner" id="conn-banner" role="status" hidden></div>
<button type="button" class="ask-fab" id="btn-ask" aria-controls="assistant" aria-expanded="false" aria-haspopup="dialog" aria-describedby="ask-fab-help" title="Ask about the project, or request a change. Drag, or Shift+Arrow keys, to move this button; Shift+Home puts it back. Esc closes the assistant; drafts are kept."><svg class="icon"><use href="#i-ask"/></svg><span>Ask</span><i class="fab-dot" aria-hidden="true"></i></button>
<span class="sr-only" id="ask-fab-help">Opens the floating assistant. Drag it, or press Shift with the arrow keys, to move it; Shift+Home puts it back in the bottom-right corner.</span>
<div class="assistant" id="assistant" role="dialog" aria-modal="false" aria-labelledby="asst-title" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
